name: Publish release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub tag to publish (for example 3.6.33)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract release notes
        run: |
          awk -v version="$RELEASE_TAG" '
            {
              heading = $0
              sub(/\r$/, "", heading)
              gsub(/\\\[/, "[", heading)
              gsub(/\\\]/, "]", heading)
            }
            index(heading, "## [" version "] - ") == 1 {
              date = heading
              sub(/^.*\] - /, "", date)
              print "Originally released on " date "."
              print ""
              found = 1
              next
            }
            found && heading ~ /^## \[/ { exit }
            found { print }
            END {
              if (!found) {
                print "No CHANGELOG.md entry found for " version > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "OASYS $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
